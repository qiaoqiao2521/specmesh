name: Architecture Explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build native Map and focused view with shared check results
        id: build
        continue-on-error: true
        env:
          TZ: UTC
          PYTHONDONTWRITEBYTECODE: "1"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base-ref "$BASE_SHA")
          fi
          build_exit=0
          python3 -B scripts/build_architecture.py --root . --output dist/architecture --run-checks "${args[@]}" || build_exit=$?
          if [[ -f dist/architecture/status.json ]]; then
            python3 -B scripts/build_architecture.py --root . --output dist/architecture/focus-map \
              --results dist/architecture/status.json --focus "map source" --budget 1000 "${args[@]}" || build_exit=$?
          fi
          exit "$build_exit"
      - name: Save the offline page and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-explorer-${{ github.sha }}
          path: dist/architecture/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed-check status
        if: steps.build.outcome == 'failure'
        run: exit 1
